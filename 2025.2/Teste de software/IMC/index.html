<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculadora IMC</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 20px;
			}

			.container {
				background: white;
				padding: 40px;
				border-radius: 15px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
				max-width: 500px;
				width: 100%;
			}

			h1 {
				color: #333;
				margin-bottom: 30px;
				text-align: center;
				font-size: 28px;
			}

			.form-group {
				margin-bottom: 20px;
			}

			label {
				display: block;
				margin-bottom: 8px;
				color: #555;
				font-weight: 600;
				font-size: 14px;
			}

			input[type="number"] {
				width: 100%;
				padding: 12px;
				border: 2px solid #ddd;
				border-radius: 8px;
				font-size: 16px;
				transition: border-color 0.3s;
			}

			input[type="number"]:focus {
				outline: none;
				border-color: #667eea;
				box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
			}

			.gender-selector {
				display: flex;
				gap: 15px;
				margin-bottom: 25px;
			}

			.gender-btn {
				flex: 1;
				padding: 12px;
				border: 2px solid #ddd;
				background: white;
				border-radius: 8px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s;
				color: #555;
			}

			.gender-btn:hover {
				border-color: #667eea;
				background: #f0f4ff;
			}

			.gender-btn.active {
				background: #667eea;
				color: white;
				border-color: #667eea;
			}

			.button-group {
				display: flex;
				gap: 15px;
			}

			button[type="button"] {
				flex: 1;
				padding: 14px;
				border: none;
				border-radius: 8px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s;
			}

			#calculateBtn {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
			}

			#calculateBtn:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			}

			#calculateBtn:active {
				transform: translateY(0);
			}

			#resetBtn {
				background: #f0f0f0;
				color: #555;
			}

			#resetBtn:hover {
				background: #e0e0e0;
			}

			.result {
				margin-top: 30px;
				padding: 20px;
				border-radius: 10px;
				text-align: center;
				display: none;
				background: #f9f9f9;
			}

			.result.show {
				display: block;
				animation: slideIn 0.3s ease;
			}

			@keyframes slideIn {
				from {
					opacity: 0;
					transform: translateY(-10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.result h2 {
				color: #333;
				font-size: 20px;
				margin-bottom: 10px;
			}

			.imc-value {
				font-size: 36px;
				font-weight: bold;
				color: #667eea;
				margin: 15px 0;
			}

			.classification {
				font-size: 18px;
				color: #555;
				margin-top: 10px;
			}

			.classification.underweight {
				color: #4a90e2;
			}

			.classification.normal {
				color: #7ed321;
			}

			.classification.overweight {
				color: #f5a623;
			}

			.classification.obese {
				color: #d0021b;
			}

			.error {
				color: #d0021b;
				font-size: 14px;
				margin-top: 5px;
				display: none;
			}

			.error.show {
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Calculadora IMC</h1>

			<div class="form-group">
				<label>Selecione o Gênero:</label>
				<div class="gender-selector">
					<button type="button" class="gender-btn" data-gender="M">
						♂ Masculino
					</button>
					<button type="button" class="gender-btn" data-gender="F">
						♀ Feminino
					</button>
				</div>
				<div class="error" id="genderError">
					Por favor, selecione um gênero
				</div>
			</div>

			<div class="form-group">
				<label for="weight">Peso (kg):</label>
				<input
					type="number"
					id="weight"
					placeholder="Ex: 75"
					step="0.1"
					min="0"
				/>
				<div class="error" id="weightError">
					Por favor, insira um peso válido
				</div>
			</div>

			<div class="form-group">
				<label for="height">Altura (m):</label>
				<input
					type="number"
					id="height"
					placeholder="Ex: 1.75"
					step="0.01"
					min="0"
				/>
				<div class="error" id="heightError">
					Por favor, insira uma altura válida
				</div>
			</div>

			<div class="button-group">
				<button type="button" id="calculateBtn">Calcular IMC</button>
				<button type="button" id="resetBtn">Limpar</button>
			</div>

			<div class="result" id="result">
				<h2>Seu IMC é:</h2>
				<div class="imc-value" id="imcValue">0.00</div>
				<div class="classification" id="classification"></div>
			</div>
		</div>

		<script>
			let selectedGender = null;
			const imcRanges = {
				M: {
					underweight: 20.7,
					normal: 26.4,
					overweight: 27.8,
					obese: 31.1,
				},
				F: {
					underweight: 19.1,
					normal: 25.8,
					overweight: 27.3,
					obese: 32.3,
				},
			};

			// Gender selection
			document.querySelectorAll(".gender-btn").forEach((btn) => {
				btn.addEventListener("click", function () {
					document
						.querySelectorAll(".gender-btn")
						.forEach((b) => b.classList.remove("active"));
					this.classList.add("active");
					selectedGender = this.dataset.gender;
					document
						.getElementById("genderError")
						.classList.remove("show");
				});
			});

			// Calculate IMC
			document
				.getElementById("calculateBtn")
				.addEventListener("click", function () {
					const weight = parseFloat(
						document.getElementById("weight").value
					);
					const height = parseFloat(
						document.getElementById("height").value
					);
					let hasError = false;

					// Clear all errors
					document
						.querySelectorAll(".error")
						.forEach((e) => e.classList.remove("show"));

					// Validate
					if (!selectedGender) {
						document
							.getElementById("genderError")
							.classList.add("show");
						hasError = true;
					}

					if (!weight || weight <= 0) {
						document
							.getElementById("weightError")
							.classList.add("show");
						hasError = true;
					}

					if (!height || height <= 0) {
						document
							.getElementById("heightError")
							.classList.add("show");
						hasError = true;
					}

					if (hasError) return;

					// Calculate
					const imc = weight / (height * height);
					const ranges = imcRanges[selectedGender];

					// Determine classification
					let classification = "";
					let className = "";

					if (imc < ranges.underweight) {
						classification = "Abaixo do peso";
						className = "underweight";
					} else if (imc < ranges.normal) {
						classification = "Peso normal";
						className = "normal";
					} else if (imc < ranges.overweight) {
						classification = "Sobrepeso";
						className = "overweight";
					} else if (imc < ranges.obese) {
						classification = "Obeso";
						className = "obese";
					} else {
						classification = "Obeso grave";
						className = "obese";
					}

					// Display result
					document.getElementById("imcValue").textContent =
						imc.toFixed(2);
					const classificationDiv =
						document.getElementById("classification");
					classificationDiv.textContent = classification;
					classificationDiv.className = "classification " + className;
					document.getElementById("result").classList.add("show");
				});

			// Reset form
			document
				.getElementById("resetBtn")
				.addEventListener("click", function () {
					document.getElementById("weight").value = "";
					document.getElementById("height").value = "";
					document
						.querySelectorAll(".gender-btn")
						.forEach((b) => b.classList.remove("active"));
					document
						.querySelectorAll(".error")
						.forEach((e) => e.classList.remove("show"));
					document.getElementById("result").classList.remove("show");
					selectedGender = null;
				});

			// Enter key to calculate
			document
				.getElementById("height")
				.addEventListener("keypress", function (e) {
					if (e.key === "Enter") {
						document.getElementById("calculateBtn").click();
					}
				});
		</script>
	</body>
</html>
